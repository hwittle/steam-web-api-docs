site_name: Unofficial Steam Web API documentation
site_url: https://hwittle.github.io/steam-web-api-docs/
site_description: An unofficial reference for the Steam Web API, with parameters, example requests, and captured responses in JSON, XML, and VDF.
repo_url: https://github.com/hwittle/steam-web-api-docs
edit_uri: edit/main/docs/
copyright: Steam is a trademark of Valve Corporation. This project is not affiliated with or endorsed by Valve.
strict: true

theme:
  name: material
  font: false
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.integrate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Endpoints:
    - IPlayerService:
      - IPlayerService/get-badges.md
      - IPlayerService/get-community-badge-progress.md
      - IPlayerService/get-owned-games.md
      - IPlayerService/get-recently-played-games.md
      - IPlayerService/get-single-game-playtime.md
      - IPlayerService/get-steam-level.md
    - ISteamUser:
      - ISteamUser/get-friend-list.md
      - ISteamUser/get-player-summaries.md
    - ISteamUserStats:
      - ISteamUserStats/get-player-achievements.md
  - Errors: errors.md
  - Project:
    - About this documentation: about.md
    - Contributing: contributing.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - macros:
      module_name: main
      on_error_fail: true

extra_css:
  - stylesheets/style.css