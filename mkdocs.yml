site_name: Unofficial Steam Web API Documentation

site_url: https://hwittle.github.io/steam-web-api-docs/

theme:
  name: material
  font: false
  features:
    - content.code.copy
    - navigation.expand
    - navigation.sections
    - toc.integrate
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - ISteamUser:
    - GetPlayerSummaries: get-player-summaries.md
    - GetFriendList: get-friend-list.md
  - ISteamUserStats:
    - GetPlayerAchievements: get-player-achievements.md
  - IPlayerService:
    - GetOwnedGames: get-owned-games.md
    - GetRecentlyPlayedGames: get-recently-played-games.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - git-revision-date-localized:
      enable_creation_date: true
  - search
  - macros:
      module_name: main
      on_error_fail: false

extra_css:
  - stylesheets/style.css